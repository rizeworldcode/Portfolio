<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 580" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14111d"/>
      <stop offset="50%" stop-color="#1c162b"/>
      <stop offset="100%" stop-color="#0c0a12"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="100%" stop-color="#fda085"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="rgba(236, 72, 153, 0.28)"/>
      <stop offset="60%" stop-color="rgba(139, 92, 246, 0.12)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <filter id="blurLight">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="580" fill="url(#bgGrad)"/>

  <!-- Ambient Glow -->
  <circle cx="240" cy="240" r="180" fill="url(#glow)"/>
  <circle cx="240" cy="230" r="100" fill="#ec4899" opacity="0.15" filter="url(#blurLight)"/>

  <!-- Fashion Grid Accents -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="4 6">
    <circle cx="240" cy="240" r="160" fill="none"/>
    <circle cx="240" cy="240" r="210" fill="none"/>
    <line x1="240" y1="40" x2="240" y2="440"/>
  </g>

  <!-- Scissors & Stitch Craft Motif -->
  <g transform="translate(240, 220)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Tailor Dotted Stitch Arc -->
    <path d="M -110,-40 C -80,-120 80,-120 110,-40 C 130,20 100,100 0,130 C -100,100 -130,20 -110,-40 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="5 5" opacity="0.5"/>

    <!-- Dressmaker Mannequin Silhouette -->
    <!-- Head finial -->
    <circle cx="0" cy="-115" r="9" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <line x1="0" y1="-106" x2="0" y2="-94" stroke="url(#goldGrad)" stroke-width="2.5"/>

    <!-- Neck / Hanger Bar -->
    <path d="M -42,-78 C -20,-88 20,-88 42,-78" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>

    <!-- Mannequin Torso Body -->
    <path d="M -42,-78 C -36,-50 -26,-20 -28,0 C -30,22 -44,60 -40,75 C -36,88 36,88 40,75 C 44,60 30,22 28,0 C 26,-20 36,-50 42,-78 Z" 
          fill="rgba(255,255,255,0.03)" stroke="url(#accentGrad)" stroke-width="2.5"/>

    <!-- Torso Style Lines (Princess Seams) -->
    <path d="M -14,-72 C -10,-30 -8,15 -14,84" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.2" stroke-dasharray="3 3"/>
    <path d="M 14,-72 C 10,-30 8,15 14,84" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.2" stroke-dasharray="3 3"/>
    <path d="M -28,0 C -10,6 10,6 28,0" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.2"/>
    <path d="M -34,42 C -10,50 10,50 34,42" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.2"/>

    <!-- Stand Pole & Tripod Base -->
    <line x1="0" y1="88" x2="0" y2="155" stroke="url(#goldGrad)" stroke-width="3"/>
    <circle cx="0" cy="115" r="4" fill="url(#goldGrad)"/>
    <path d="M -30,175 L 0,155 L 30,175" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>

    <!-- Fashion Needle Accent -->
    <g transform="translate(68, -40) rotate(32)">
      <line x1="0" y1="-35" x2="0" y2="35" stroke="#f6d365" stroke-width="2"/>
      <ellipse cx="0" cy="-28" rx="1.5" ry="4" fill="#14111d" stroke="#f6d365" stroke-width="1.2"/>
      <!-- Thread looping -->
      <path d="M 0,-28 C 15,-40 25,-15 15,5 C 5,25 25,40 35,30" fill="none" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="2 3"/>
    </g>

    <!-- Measuring Tape Curved Ribbon -->
    <path d="M -85,45 C -55,75 -35,5 0,18 C 35,32 65,-5 85,25" fill="none" stroke="#fbbf24" stroke-width="3.5" opacity="0.6"/>
  </g>

  <!-- Sparks / Sparkle Crosses -->
  <g fill="#fde047" opacity="0.8">
    <path d="M 110,140 Q 110,150 120,150 Q 110,150 110,160 Q 110,150 100,150 Q 110,150 110,140 Z"/>
    <path d="M 370,120 Q 370,132 382,132 Q 370,132 370,144 Q 370,132 358,132 Q 370,132 370,120 Z" transform="scale(0.8) translate(80, 20)"/>
    <path d="M 360,330 Q 360,338 368,338 Q 360,338 360,346 Q 360,338 352,338 Q 360,338 360,330 Z" transform="scale(0.7) translate(140, 120)"/>
  </g>

  <!-- Badge / Bottom Visual Title -->
  <g transform="translate(240, 480)" text-anchor="middle">
    <rect x="-140" y="-30" width="280" height="38" rx="19" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
    <text x="0" y="-6" fill="#f9fafb" font-family="'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="3.5">
      BESPOKE &amp; ATELIER
    </text>
  </g>
</svg>

